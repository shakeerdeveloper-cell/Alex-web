<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Ultra-Fast Voice Test</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        button { 
            padding: 18px 36px; 
            font-size: 20px; 
            background-color: #00e676; 
            color: #000; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            transition: 0.2s;
        }
        button.listening { 
            background-color: #f44336; 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }
        #status { margin-top: 20px; font-size: 16px; color: #aaaaaa; }
        #transcript { margin-top: 30px; font-size: 26px; text-align: center; max-width: 90%; color: #e0e0e0; min-height: 60px; }
        #reply { margin-top: 20px; font-size: 22px; color: #00e676; text-align: center; max-width: 90%; min-height: 60px; }
    </style>
</head>
<body>

    <button id="micBtn">Start Alex Assistant</button>
    <div id="status">Click button to enable microphone</div>
    <div id="transcript"></div>
    <div id="reply"></div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        const replyDiv = document.getElementById('reply');

        const SERVER_URL = 'https://alex-backend-1-moif.onrender.com/chat';

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        
        recognition.continuous = true; 
        recognition.interimResults = true; // Real-time word-by-word streaming
        recognition.lang = 'en-US';

        let isListening = false;
        let isSpeaking = false; 
        let silenceTimer = null;
        let lastSpokenText = "";

        micBtn.onclick = () => {
            if (!isListening) {
                recognition.start();
            } else {
                recognition.stop();
            }
        };

        recognition.onstart = () => {
            isListening = true;
            micBtn.textContent = 'Stop Listening';
            micBtn.classList.add('listening');
            statusDiv.textContent = 'Listening... Say "Alex"';
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.textContent = 'Start Alex Assistant';
            micBtn.classList.remove('listening');
            if (!isSpeaking) {
                setTimeout(() => { try { recognition.start(); } catch(e){} }, 200);
            }
        };

        // Real-Time Speech Processing
        recognition.onresult = (event) => {
            let currentText = "";

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                currentText += event.results[i][0].transcript;
            }

            currentText = currentText.trim().toLowerCase();
            if (!currentText) return;

            // Live Typing: Display text instantly on screen as you talk
            transcriptDiv.textContent = `You: "${currentText}"`;
            lastSpokenText = currentText;

            // Instant Wake-Word Trigger ("Alex" or "Hey Alex")
            if (currentText === "alex" || currentText === "hey alex") {
                clearTimeout(silenceTimer);
                recognition.stop();
                speakText("What can I do for you, sir?");
                return;
            }

            // Quick Silence Detector (Sends request 700ms after you stop speaking)
            if (currentText.startsWith("alex ") || currentText.startsWith("hey alex ")) {
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    processQuestion(lastSpokenText);
                }, 700); // 700 milliseconds of silence triggers instant send
            }
        };

        async function processQuestion(rawTranscript) {
            clearTimeout(silenceTimer);
            recognition.stop();

            let question = rawTranscript.replace("hey alex", "").replace("alex", "").trim();
            if (!question) return;

            statusDiv.textContent = 'Sending to server...';
            replyDiv.textContent = 'Thinking...';

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: question })
                });

                const data = await response.json();

                if (data.reply) {
                    replyDiv.textContent = `Alex: ${data.reply}`;
                    speakText(data.reply);
                } else {
                    replyDiv.textContent = 'Error getting response.';
                    speakText("Sorry, I encountered an error.");
                }
            } catch (error) {
                replyDiv.textContent = 'Network Connection Error.';
                speakText("Could not reach backend server.");
            }
        }

        function speakText(text) {
            isSpeaking = true;
            try { recognition.stop(); } catch(e){}

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 1;
            utterance.rate = 1.1; // Slightly faster speech output

            utterance.onstart = () => {
                statusDiv.textContent = 'Alex speaking...';
            };

            utterance.onend = () => {
                isSpeaking = false;
                replyDiv.textContent = '';
                transcriptDiv.textContent = '';
                statusDiv.textContent = 'Listening... Say "Alex"';
                try { recognition.start(); } catch(e){}
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
