<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Voice Assistant</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        button.mic-btn { 
            padding: 20px 40px; 
            font-size: 22px; 
            background-color: #00e676; 
            color: #000; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            transition: 0.2s;
        }
        button.mic-btn.listening { 
            background-color: #f44336; 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }
        #status { margin-top: 20px; font-size: 18px; color: #aaaaaa; text-align: center; }
        #transcript { margin-top: 30px; font-size: 24px; text-align: center; max-width: 90%; color: #e0e0e0; min-height: 40px; }
        #reply { margin-top: 20px; font-size: 22px; color: #00e676; text-align: center; max-width: 90%; min-height: 40px; line-height: 1.4; }
    </style>
</head>
<body>

    <button id="micBtn" class="mic-btn">Start Listening</button>
    <div id="status">Tap "Start", ask your question, then tap "Stop & Send"</div>
    
    <div id="transcript"></div>
    <div id="reply"></div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        const replyDiv = document.getElementById('reply');

        // Your live Render backend
        const SERVER_URL = 'https://alex-backend-1-moif.onrender.com/chat';

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        recognition.continuous = true; 
        recognition.interimResults = true; 
        recognition.lang = 'en-US';

        let currentSpeech = "";

        // --- 1. THE WALKIE-TALKIE BUTTON LOGIC ---
        micBtn.onclick = () => {
            if (micBtn.textContent === "Start Listening") {
                // START RECORDING
                currentSpeech = "";
                transcriptDiv.textContent = "";
                replyDiv.textContent = "";
                
                micBtn.textContent = "Stop & Send";
                micBtn.classList.add('listening');
                statusDiv.textContent = "🔴 Recording... Speak your question now!";
                
                window.speechSynthesis.cancel(); // Stop any leftover speech
                recognition.start();
            } else {
                // STOP AND SEND
                micBtn.textContent = "Start Listening";
                micBtn.classList.remove('listening');
                statusDiv.textContent = "Sending to server...";
                
                recognition.stop();
                
                if (currentSpeech.trim() !== "") {
                    processQuestion(currentSpeech);
                } else {
                    statusDiv.textContent = "I didn't hear anything. Try again.";
                }
            }
        };

        // --- 2. LIVE TEXT DISPLAY ---
        recognition.onresult = (event) => {
            let text = "";
            for (let i = 0; i < event.results.length; ++i) {
                text += event.results[i][0].transcript;
            }
            currentSpeech = text;
            transcriptDiv.textContent = `You: "${currentSpeech}"`;
        };

        // Prevent the browser from cutting off early if there is a long pause
        recognition.onend = () => {
            if (micBtn.textContent === "Stop & Send") {
                recognition.start(); 
            }
        };

        // --- 3. SERVER CONNECTION ---
        async function processQuestion(questionText) {
            replyDiv.textContent = 'Alex is thinking...';

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: questionText })
                });

                const data = await response.json();

                if (data.reply) {
                    replyDiv.textContent = `Alex: ${data.reply}`;
                    statusDiv.textContent = "Done!";
                    speakText(data.reply);
                } else {
                    replyDiv.textContent = 'Error: No reply tag in JSON.';
                }
            } catch (error) {
                console.error(error);
                replyDiv.textContent = 'Network Error.';
                statusDiv.textContent = "Could not connect to the server.";
            }
        }

        // --- 4. TEXT TO SPEECH OUTPUT ---
        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 1;
            utterance.rate = 1.0;

            utterance.onstart = () => {
                statusDiv.textContent = 'Alex is speaking...';
            };

            utterance.onend = () => {
                statusDiv.textContent = 'Tap "Start" to ask another question.';
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
