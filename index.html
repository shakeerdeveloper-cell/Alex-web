<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Voice Assistant</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        button { 
            padding: 18px 36px; 
            font-size: 20px; 
            background-color: #00e676; 
            color: #000; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
            transition: 0.2s;
        }
        button.listening { 
            background-color: #f44336; 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }
        #status { margin-top: 20px; font-size: 16px; color: #aaaaaa; }
        #transcript { margin-top: 30px; font-size: 24px; text-align: center; max-width: 90%; color: #e0e0e0; min-height: 60px; }
        #reply { margin-top: 20px; font-size: 22px; color: #00e676; text-align: center; max-width: 90%; min-height: 60px; }
    </style>
</head>
<body>

    <button id="micBtn">Start Alex Assistant</button>
    <div id="status">Click button to allow microphone</div>
    <div id="transcript"></div>
    <div id="reply"></div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        const replyDiv = document.getElementById('reply');

        const SERVER_URL = 'https://alex-backend-1-moif.onrender.com/chat';

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        recognition.continuous = true; 
        recognition.interimResults = true; 
        recognition.lang = 'en-US';

        let userWantsListening = false;
        let isSpeaking = false; 
        let silenceTimer = null;
        let lastSpokenText = "";

        micBtn.onclick = () => {
            if (!userWantsListening) {
                userWantsListening = true;
                startListening();
            } else {
                userWantsListening = false;
                stopListening();
            }
        };

        function startListening() {
            if (isSpeaking) return;
            try {
                recognition.start();
            } catch (e) {}
        }

        function stopListening() {
            try {
                recognition.stop();
            } catch (e) {}
        }

        recognition.onstart = () => {
            micBtn.textContent = 'Stop Listening';
            micBtn.classList.add('listening');
            statusDiv.textContent = 'Listening... Say "Alex"';
        };

        recognition.onend = () => {
            micBtn.textContent = 'Start Alex Assistant';
            micBtn.classList.remove('listening');

            // Only restart if user turned it on AND Alex isn't speaking
            if (userWantsListening && !isSpeaking) {
                setTimeout(() => {
                    if (userWantsListening && !isSpeaking) {
                        startListening();
                    }
                }, 400);
            }
        };

        recognition.onresult = (event) => {
            if (isSpeaking) return;

            let currentText = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                currentText += event.results[i][0].transcript;
            }

            currentText = currentText.trim().toLowerCase();
            if (!currentText) return;

            transcriptDiv.textContent = `You: "${currentText}"`;
            lastSpokenText = currentText;

            // Trigger A: Wake word only
            if (currentText === "alex" || currentText === "hey alex") {
                clearTimeout(silenceTimer);
                stopListening();
                speakText("What can I do for you, sir?");
                return;
            }

            // Trigger B: Wake word + Question
            if (currentText.startsWith("alex ") || currentText.startsWith("hey alex ")) {
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    processQuestion(lastSpokenText);
                }, 800);
            }
        };

        async function processQuestion(rawTranscript) {
            clearTimeout(silenceTimer);
            stopListening();

            let question = rawTranscript.replace("hey alex", "").replace("alex", "").trim();
            if (!question) return;

            statusDiv.textContent = 'Sending to server...';
            replyDiv.textContent = 'Thinking...';

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: question })
                });

                const data = await response.json();

                if (data.reply) {
                    replyDiv.textContent = `Alex: ${data.reply}`;
                    speakText(data.reply);
                } else {
                    replyDiv.textContent = 'Error getting response.';
                    speakText("Sorry, I encountered an error.");
                }
            } catch (error) {
                replyDiv.textContent = 'Network Connection Error.';
                speakText("Could not reach backend server.");
            }
        }

        function speakText(text) {
            isSpeaking = true;
            stopListening();

            // Clear any previous queued audio
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 1;
            utterance.rate = 1.0;

            utterance.onstart = () => {
                statusDiv.textContent = 'Alex speaking...';
            };

            utterance.onend = () => {
                statusDiv.textContent = 'Clearing audio...';
                
                // 1-second delay lets speaker hardware completely close before opening mic
                setTimeout(() => {
                    isSpeaking = false;
                    replyDiv.textContent = '';
                    transcriptDiv.textContent = '';
                    if (userWantsListening) {
                        startListening();
                    }
                }, 1000); 
            };

            utterance.onerror = () => {
                isSpeaking = false;
                if (userWantsListening) startListening();
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
