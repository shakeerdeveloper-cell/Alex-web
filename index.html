<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Text Chat Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #1e1e1e;
            padding: 15px 20px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            text-align: center;
            color: #00e676;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #00e676;
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            background-color: #1e1e1e;
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }
        .loading {
            font-style: italic;
            color: #888;
            font-size: 14px;
            align-self: flex-start;
            display: none;
            margin-left: 10px;
        }
        #input-container {
            padding: 15px 20px;
            background-color: #1e1e1e;
            display: flex;
            gap: 12px;
            border-top: 1px solid #333;
        }
        #message-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        #message-input:focus {
            border-color: #00e676;
        }
        #send-btn {
            padding: 0 30px;
            background-color: #00e676;
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #send-btn:hover {
            background-color: #00c853;
        }
    </style>
</head>
<body>

    <div id="header">Alex AI Assistant</div>

    <div id="chat-container">
        <div class="message ai-message">Hello! I am Alex. Type a message below to test my brain!</div>
        <div class="loading" id="loading-indicator">Alex is thinking... (Render might take ~45s to wake up on the first message)</div>
    </div>

    <div id="input-container">
        <input type="text" id="message-input" placeholder="Ask Alex a question..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const loadingIndicator = document.getElementById('loading-indicator');

        const SERVER_URL = 'https://alex-backend-rn1a.onrender.com/chat';

        function addMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(isUser ? 'user-message' : 'ai-message');
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            
            chatContainer.insertBefore(msgDiv, loadingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Display user message
            addMessage(text, true);
            messageInput.value = '';
            
            // Show loading state
            loadingIndicator.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                loadingIndicator.style.display = 'none';

                if (data.reply) {
                    addMessage(data.reply, false);
                } else {
                    addMessage("Error: The server responded, but no 'reply' text was found.", false);
                }
            } catch (error) {
                loadingIndicator.style.display = 'none';
                console.error(error);
                addMessage("Network Error: Could not connect to your Render server. Check your Render logs.", false);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
